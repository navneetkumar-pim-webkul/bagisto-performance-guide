# ============================================================================
# Bagisto - production nginx server block
#
# Fixes the two audits that always fail on the `php artisan serve` dev server:
#   - "Use efficient cache lifetimes"  (static assets need Cache-Control)
#   - "No compression applied"         (HTML/CSS/JS need gzip/brotli)
#
# Install:
#   1. Copy to /etc/nginx/sites-available/bagisto.conf (or /etc/nginx/conf.d/)
#   2. Enable + reload:  ln -s ... /etc/nginx/sites-enabled/ ; nginx -t && systemctl reload nginx
#
# Adjust before use:
#   - server_name      -> your domain
#   - root             -> absolute path to the project's public/ directory
#   - fastcgi_pass     -> the PHP-FPM socket for your PHP version
#   - ssl_certificate  -> your TLS certificate paths
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name example.com;

    # Absolute path to Bagisto's public/ directory.
    root /var/www/bagisto/public;

    index index.php;

    charset utf-8;

    # Keep in step with PHP `upload_max_filesize`.
    client_max_body_size 128M;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ------------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Brotli compresses better than gzip. Enable only if the nginx
    # `ngx_brotli` module is installed, otherwise leave commented.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------------
    # Long-lived cache for build assets (Vite output - filenames are hashed,
    # so a new build always produces a new URL: safe to cache forever).
    # ------------------------------------------------------------------------
    location ^~ /themes/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Bagisto-generated resized images. These are created on demand: the first
    # request for a missing size MUST reach Laravel (index.php) so it can
    # generate the file. Using `=404` here would break image resizing.
    location ^~ /cache/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Uploaded media.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Fonts and other static files served from the document root.
    location ~* \.(?:woff2?|ttf|eot|otf|ico|svg|jpe?g|png|gif|webp|avif|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------------------
    # Application routing
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Adjust to the PHP-FPM socket on this server.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Do NOT override Cache-Control here. Bagisto sets its own headers per
        # response: HTML pages are sent no-cache, while the on-demand image
        # cache route returns long-lived cacheable headers. Forcing no-cache
        # would make every resized product/banner image uncacheable.

        # Behind a TLS-terminating proxy/CDN (e.g. Cloudflare), uncomment so
        # PHP/Bagisto generate https:// URLs and avoid redirect loops:
        # fastcgi_param HTTPS on;
        # fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Block access to hidden files (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/bagisto-error.log;
    access_log /var/log/nginx/bagisto-access.log;
}
