# ============================================================================
# Bagisto - Apache performance directives (compression + cache headers)
#
# Bagisto already ships a public/.htaccess (Laravel rewrite rules). This file
# adds compression and cache headers on top of it.
#
# Use it one of two ways:
#
#   A. Append the blocks below into the existing  public/.htaccess
#
#   B. Keep it as a server-config include and reference it from the vhost:
#        Include /path/to/htaccess-performance.conf
#
# Required modules: deflate, expires, headers   (brotli optional)
# ============================================================================

# ----------------------------------------------------------------------------
# Compression
# ----------------------------------------------------------------------------
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE application/xml application/rss+xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Brotli compresses better than gzip. Enable only if mod_brotli is installed.
<IfModule mod_brotli.c>
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css
    AddOutputFilterByType BROTLI_COMPRESS application/javascript application/json
    AddOutputFilterByType BROTLI_COMPRESS image/svg+xml
</IfModule>

# ----------------------------------------------------------------------------
# Cache headers
# ----------------------------------------------------------------------------
# Expiry (mod_expires) and Cache-Control (mod_headers) are kept in separate
# IfModule blocks so a missing module does not break the other directive.
<IfModule mod_expires.c>
    ExpiresActive On

    # Vite build assets - hashed filenames, safe to cache forever.
    <FilesMatch "\.(js|css|woff2?|ttf|eot|otf)$">
        ExpiresDefault "access plus 1 year"
    </FilesMatch>

    # Images (resized /cache/ output, uploads, theme assets).
    <FilesMatch "\.(jpe?g|png|gif|webp|avif|svg|ico)$">
        ExpiresDefault "access plus 30 days"
    </FilesMatch>
</IfModule>

<IfModule mod_headers.c>
    # Vite build assets - hashed filenames, safe to cache forever.
    <FilesMatch "\.(js|css|woff2?|ttf|eot|otf)$">
        Header set Cache-Control "public, immutable"
    </FilesMatch>

    # Images (resized /cache/ output, uploads, theme assets).
    <FilesMatch "\.(jpe?g|png|gif|webp|avif|svg|ico)$">
        Header set Cache-Control "public"
    </FilesMatch>
</IfModule>

# ----------------------------------------------------------------------------
# IMPORTANT
#
# - Do NOT add a rule that returns 404 for missing /cache/ files. Bagisto's
#   default rewrite must send them to index.php so images are resized on demand.
#
# - Do NOT set a global Cache-Control on PHP/HTML responses. Bagisto manages its
#   own per-response headers (HTML no-cache, resized images long-lived public).
# ============================================================================
