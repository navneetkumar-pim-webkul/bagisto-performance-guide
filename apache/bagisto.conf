# ============================================================================
# Bagisto - production Apache virtual host
#
# Pair this with the performance directives in apache/htaccess-performance.conf
# (compression + cache headers).
#
# Required modules:
#   a2enmod rewrite headers expires deflate ssl proxy_fcgi setenvif
#   # brotli is optional:  a2enmod brotli
#
# Install:
#   1. Copy to /etc/apache2/sites-available/bagisto.conf
#   2. a2ensite bagisto.conf
#   3. apachectl configtest && systemctl reload apache2
#
# Adjust before use:
#   - ServerName        -> your domain
#   - DocumentRoot      -> absolute path to the project's public/ directory
#   - SSLCertificate*   -> your TLS certificate paths
#   - the PHP-FPM socket path
# ============================================================================

<VirtualHost *:80>
    ServerName example.com

    # Redirect all HTTP traffic to HTTPS.
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com

    DocumentRoot /var/www/bagisto/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    <Directory /var/www/bagisto/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand .php requests to PHP-FPM. Adjust the socket to your PHP version.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Behind a TLS-terminating proxy/CDN (e.g. Cloudflare), tell PHP the
    # request was HTTPS so Bagisto generates https:// URLs:
    # SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  ${APACHE_LOG_DIR}/bagisto-error.log
    CustomLog ${APACHE_LOG_DIR}/bagisto-access.log combined
</VirtualHost>

# ----------------------------------------------------------------------------
# Notes
#
# - Bagisto's public/.htaccess already rewrites every non-file request to
#   index.php. That means a request for a not-yet-generated image such as
#   /cache/medium/... reaches Laravel and is resized on demand. Do NOT add a
#   rule that returns 404 for missing /cache/ files - it breaks image resizing.
#
# - Do NOT force a global `Header set Cache-Control` for PHP responses. Bagisto
#   sends its own headers: HTML is no-cache, resized images are long-lived
#   public. Overriding would make every resized image uncacheable.
#
# - With mod_php instead of PHP-FPM, drop the <FilesMatch> proxy block; the
#   rest of the vhost is unchanged.
# ============================================================================
